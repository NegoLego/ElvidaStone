<!DOCTYPE html>
<html lang=en>
<head>
  <title>Elvida Stone</title>
  
</head>
<body>
  <div style="background-color: #222222; color: white">
    <p>PAGINA DE CATEOGRII</p>
  </div>
  <!-- Gallery container/ changed something to recommit -->
  <div id="gallery" class="gallery-grid"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const categorySlug = params.get('c');

    fetch(`/data/categories/${categorySlug}.json`)
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('gallery');
        if (!products.items || products.items.length === 0) {
          container.innerHTML = '<p>No photos uploaded yet.</p>';
          return;
       }

        container.innerHTML = products.items.map(item => `
         <figure class="gallery-item">
           <img src="${item.image}" alt="${item.title}" loading="lazy" />
           <figcaption>
             <strong>${item.title}</strong>
           </figcaption>
         </figure>
          `).join('');
        })
    .catch(err => console.error('Error loading gallery:', err));
  </script>
</body>
</html>
